<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IRIS · editor de portafolios</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="topbar"><div><span class="eyebrow">IRIS / archivo a portafolios</span><h1>Mesa de edición</h1></div><div class="actions"><label class="profile-choice">Perfil<select id="profileSelect"><option value="portfolio">Portafolio extendido</option><option value="dossier">Dossier breve</option></select></label><button id="loadDemo">Cargar demo</button><label class="button">Importar JSON<input id="importFile" type="file" accept=".json"></label><button id="saveProject">Guardar proyecto</button><button id="exportAll" class="primary">Exportar salidas</button></div></header>
<main class="shell"><section class="library"><div class="section-head"><div><span class="eyebrow">01 / archivo</span><h2>Registros disponibles</h2></div><span id="libraryCount" class="counter"></span></div><div id="libraryList"></div></section>
<section class="stage"><div class="stage-head"><div><span class="eyebrow">02 / selección</span><h2 id="projectTitle">Sin proyecto</h2><p id="projectSubtitle" class="muted"></p></div><div class="stage-tools"><button data-lens="manual" class="lens active">Orden manual</button><button data-lens="date" class="lens">Vista por fecha</button><button id="composeNow" class="lens compose">Componer</button></div></div><div id="selectionList" class="selection-list"></div><div id="compositionPanel" class="composition-panel" hidden></div><div id="exportResults" class="export-results" hidden></div><div class="empty" id="emptyState">Carga la demo o importa un proyecto para comenzar.</div></section>
<aside class="inspector"><span class="eyebrow">03 / inspector</span><h2>Decisión editorial</h2><div id="inspectorBody" class="muted">Selecciona una pieza para editar título, texto, créditos y estado.</div></aside></main><div id="toast" role="status" aria-live="polite"></div><script type="module" src="app.js"></script></body></html>
